<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Pelanggan WiFi & Hotspot GigaNusa">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GigaNusa">

  <title>GigaNusa - Portal Pelanggan</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body {
      background-color: #5B50D6;
      background-image: radial-gradient(circle at 50% 20%, #6D62E8 0%, #483CB8 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    .loading-container {
      background: white;
      border-radius: 36px;
      padding: 40px 32px 36px 32px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      width: 320px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .splash-logo-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }
    .splash-glow {
      position: absolute;
      width: 90px;
      height: 90px;
      right: -10px;
      top: 10px;
      background: #FFA4A2;
      border-radius: 50%;
      filter: blur(22px);
      opacity: 0.6;
      pointer-events: none;
    }
    .splash-logo-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 2;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #FEE2E2;
      border-top: 3px solid #E53935;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    const serviceWorkerVersion = null;
  </script>
  <!-- Flutter initialization JS -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="splash-logo-wrap">
      <div class="splash-glow"></div>
      <!-- Official GigaNusa Logo Vector -->
      <svg class="splash-logo-svg" viewBox="0 0 500 500">
        <path d="M 120 420 L 120 250 A 130 130 0 0 1 380 250 L 380 420 A 42 42 0 0 1 296 420 L 296 250 A 46 46 0 0 0 204 250 L 204 420 A 42 42 0 0 1 120 420 Z" fill="#333745" />
        <circle cx="250" cy="275" r="90" fill="#FF333A" />
      </svg>
    </div>

    <div style="font-weight: 900; font-size: 22px; color: #C93B3B; letter-spacing: 3px;">GIGANUSA</div>
    <div style="color: #64748B; font-size: 13px; margin-top: 4px; font-weight: 500;">
      Portal Layanan Pelanggan
    </div>

    <div class="spinner"></div>

    <div style="color: #94A3B8; font-size: 11.5px; font-weight: 600;">
      Memuat Aplikasi...
    </div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              const loadingEl = document.getElementById('loading');
              if (loadingEl) loadingEl.remove();
              appRunner.runApp();
            });
          }
        });
      } else {
        // Fallback for direct flutter_bootstrap if flutter.js not found
        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.onload = function() {
          const loadingEl = document.getElementById('loading');
          if (loadingEl) loadingEl.remove();
        };
        document.body.appendChild(script);
      }
    });
  </script>
</body>
</html>
